<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email — Creatarsh</title><link rel="stylesheet" href="/css/saas-storefront.css"></head><body><main class="auth-page"><section class="auth-card"><a href="/">CREATARSH</a><p class="eyebrow">ACCOUNT SECURITY</p><h1>Verify your email.</h1><p>Confirm that this email address belongs to you.</p><button id="verify">Verify email address</button><p id="status" role="status" aria-live="polite"></p><a href="/login">Back to sign in</a></section></main><script>
const API_BASES=[window.CREATARSH_API_URL,location.origin,'https://creatarsh.onrender.com','https://creatarsh-api.onrender.com'].filter((v,i,a)=>v&&a.indexOf(v)===i).map(v=>v.replace(/\/$/,'').replace(/\/api$/,'')+'/api');
async function send(path,data){let last;for(const base of API_BASES){try{const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok){const e=new Error(d.message||'Request failed');e.status=r.status;if([404,429,502,503,504].includes(r.status)){last=e;continue}throw e}return d}catch(e){last=e;if(e.name==='TypeError'||[404,429,502,503,504].includes(e.status))continue;throw e}}throw last||new Error('Creatarsh API is unavailable')}
document.getElementById('verify').onclick=async()=>{try{const d=await send('/customer/verify-email',{token:new URLSearchParams(location.search).get('token')});document.getElementById('status').textContent=d.message}catch(x){document.getElementById('status').textContent=x.message}};
</script></body></html>
